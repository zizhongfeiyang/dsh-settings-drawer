name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
